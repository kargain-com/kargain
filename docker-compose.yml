x-default-logging: &default-logging
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    <<: *default-logging
    image: postgres:16-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponder -d kargain_ponder"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: kargain_ponder
      POSTGRES_USER: ponder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kargain

  # The writer tag is the only pointer to the running image; each writer image
  # carries its own DATABASE_SCHEMA (ADR 0016 §c). build: is for local use.
  ponder:
    <<: *default-logging
    image: ${PONDER_IMAGE_REPOSITORY:-kargain-ponder}:writer
    build:
      context: .
      dockerfile: Dockerfile.ponder
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment: &ponder-environment
      DATABASE_URL: ${DATABASE_URL:-postgresql://ponder:${POSTGRES_PASSWORD}@postgres:5432/kargain_ponder}
    ports:
      - "127.0.0.1:42069:42069"
    networks:
      - kargain

  # Deploy tooling (ADR 0016 §e): one-off, run by scripts/ponder-deploy.sh.
  ponder-deploy:
    <<: *default-logging
    image: ${PONDER_IMAGE_REPOSITORY:-kargain-ponder}:deploy
    profiles: [deploy]
    env_file:
      - .env
    environment: *ponder-environment
    volumes:
      - ./.ponder-deploy:/app/.ponder-deploy
    networks:
      - kargain

  cloudflared:
    <<: *default-logging
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - ponder
    networks:
      - kargain

  strfry:
    <<: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.strfry
    restart: always
    volumes:
      - strfry_data:/data
    networks:
      - kargain

  svm-ingest:
    <<: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.svm-ingest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ponder:${POSTGRES_PASSWORD}@postgres:5432/kargain_ponder}
      SVM_INGEST_DATABASE_URL: ${SVM_INGEST_DATABASE_URL:-postgresql://ponder:${POSTGRES_PASSWORD}@postgres:5432/kargain_ponder}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      SVM_INGEST_EID: ${SVM_INGEST_EID:-40168}
      SVM_INGEST_NAMESPACE: ${SVM_INGEST_NAMESPACE:-}
      SVM_INGEST_CATCHUP_MAX_LAG_SLOTS: ${SVM_INGEST_CATCHUP_MAX_LAG_SLOTS:-216000}
      SVM_INGEST_POLL_MS: ${SVM_INGEST_POLL_MS:-2000}
      SVM_INGEST_PORT: "42100"
    ports:
      - "127.0.0.1:42100:42100"
    networks:
      - kargain

volumes:
  postgres_data:
  strfry_data:

networks:
  kargain:
    driver: bridge
