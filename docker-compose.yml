x-default-logging: &default-logging
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    <<: *default-logging
    image: postgres:16-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponder -d kargain_ponder"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: kargain_ponder
      POSTGRES_USER: ponder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kargain

  ponder:
    <<: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.ponder
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ponder:${POSTGRES_PASSWORD}@postgres:5432/kargain_ponder}
      PONDER_RPC_URL_84532: ${PONDER_RPC_URL_84532}
      PONDER_START_BLOCK_84532: ${PONDER_START_BLOCK_84532:-latest}
      PONDER_START_BLOCK: ${PONDER_START_BLOCK:-latest}
      DATABASE_SCHEMA: kargain
    ports:
      - "127.0.0.1:42069:42069"
    networks:
      - kargain

  cloudflared:
    <<: *default-logging
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - ponder
    networks:
      - kargain

  strfry:
    <<: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.strfry
    restart: always
    volumes:
      - strfry_data:/data
    networks:
      - kargain

  svm-ingest:
    <<: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.svm-ingest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ponder:${POSTGRES_PASSWORD}@postgres:5432/kargain_ponder}
      SVM_INGEST_DATABASE_URL: ${SVM_INGEST_DATABASE_URL:-postgresql://ponder:${POSTGRES_PASSWORD}@postgres:5432/kargain_ponder}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      SVM_INGEST_EID: ${SVM_INGEST_EID:-40168}
      SVM_INGEST_NAMESPACE: ${SVM_INGEST_NAMESPACE:-}
      SVM_INGEST_CATCHUP_MAX_LAG_SLOTS: ${SVM_INGEST_CATCHUP_MAX_LAG_SLOTS:-216000}
      SVM_INGEST_POLL_MS: ${SVM_INGEST_POLL_MS:-2000}
      SVM_INGEST_PORT: "42100"
    ports:
      - "127.0.0.1:42100:42100"
    networks:
      - kargain

volumes:
  postgres_data:
  strfry_data:

networks:
  kargain:
    driver: bridge
