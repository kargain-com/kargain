x-default-logging: &default-logging
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "5"

# Writer settings shared by every Ponder writer. No `build:` here: a writer that must
# run a preserved image (ponder-legacy) must never be buildable from the checkout.
x-ponder-writer: &ponder-writer
  <<: *default-logging
  restart: always
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql://ponder:${POSTGRES_PASSWORD}@postgres:5432/kargain_ponder}
    PONDER_START_BLOCK_84532: ${PONDER_START_BLOCK_84532:-latest}
    PONDER_START_BLOCK: ${PONDER_START_BLOCK:-latest}
  networks:
    - kargain

services:
  postgres:
    <<: *default-logging
    image: postgres:16-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponder -d kargain_ponder"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: kargain_ponder
      POSTGRES_USER: ponder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kargain

  # HTTP front: pinned nginx. Tunnel / host :42069 target. Writers are blue/green.
  # No depends_on writers: a stopped spare must stay stopped when nginx restarts.
  ponder:
    <<: *default-logging
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: always
    ports:
      - "127.0.0.1:42069:42069"
    volumes:
      - ./ops/nginx/ponder.conf:/etc/nginx/nginx.conf:ro
      - ./.ponder-upstream.conf:/etc/nginx/ponder-upstream.conf:ro
    networks:
      - kargain

  ponder-blue:
    <<: *ponder-writer
    image: kargain-ponder-blue
    build:
      context: .
      dockerfile: Dockerfile.ponder
    env_file:
      - path: .env
        required: true
      - path: .ponder-slot-blue.env
        required: false

  ponder-green:
    <<: *ponder-writer
    image: kargain-ponder-green
    build:
      context: .
      dockerfile: Dockerfile.ponder
    env_file:
      - path: .env
        required: true
      - path: .ponder-slot-green.env
        required: false

  # First-cutover rollback writer (A8): tagged image kargain-ponder-legacy:cutover.
  # Never built (no `build:`) and never pulled (R5): the deploy verifies the tag equals
  # state.legacy_image before starting it, so current code can never run on the legacy schema.
  ponder-legacy:
    <<: *ponder-writer
    image: kargain-ponder-legacy:cutover
    pull_policy: never
    profiles:
      - legacy
    env_file:
      - path: .env
        required: true
      - path: .ponder-slot-legacy.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ponder:${POSTGRES_PASSWORD}@postgres:5432/kargain_ponder}
      DATABASE_SCHEMA: kargain

  cloudflared:
    <<: *default-logging
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - ponder
    networks:
      - kargain

  strfry:
    <<: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.strfry
    restart: always
    volumes:
      - strfry_data:/data
    networks:
      - kargain

  svm-ingest:
    <<: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.svm-ingest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ponder:${POSTGRES_PASSWORD}@postgres:5432/kargain_ponder}
      SVM_INGEST_DATABASE_URL: ${SVM_INGEST_DATABASE_URL:-postgresql://ponder:${POSTGRES_PASSWORD}@postgres:5432/kargain_ponder}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      SVM_INGEST_EID: ${SVM_INGEST_EID:-40168}
      SVM_INGEST_NAMESPACE: ${SVM_INGEST_NAMESPACE:-}
      SVM_INGEST_CATCHUP_MAX_LAG_SLOTS: ${SVM_INGEST_CATCHUP_MAX_LAG_SLOTS:-216000}
      SVM_INGEST_POLL_MS: ${SVM_INGEST_POLL_MS:-2000}
      SVM_INGEST_PORT: "42100"
    ports:
      - "127.0.0.1:42100:42100"
    networks:
      - kargain

volumes:
  postgres_data:
  strfry_data:

networks:
  kargain:
    driver: bridge
