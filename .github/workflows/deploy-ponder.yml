name: Deploy Ponder to VPS

on:
  workflow_dispatch:
    inputs:
      operation:
        description: deploy | hold | rollback
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - hold
          - rollback
  push:
    branches: [master]
    # Do not use a bare `src/**` — that rebuilds Ponder on every svm-ingest push.
    # paths + paths-ignore cannot both be set on the same event; exclude by omission.
    # svm-ingest / Dockerfile.svm-ingest / lib/svm deploy via deploy-svm-ingest.yml only.
    # Fingerprints (not this list) decide whether a rebuild recreates the container.
    paths:
      - "ponder.config.ts"
      - "ponder.schema.ts"
      - "src/api/**"
      - "src/index.ts"
      - "src/bridge-handlers.ts"
      - "src/commerce-handlers.ts"
      - "src/lib/**"
      - "lib/contracts/abis.generated.ts"
      - "lib/web3/commercial-active.ts"
      - "lib/web3/sepolia-addresses.ts"
      - "lib/web3/deployment-addresses.ts"
      - "Dockerfile.ponder"
      - "docker-compose.yml"
      - "ops/nginx/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-ponder.yml"
      - "scripts/lib/ponder-identity-fingerprint.ts"
      - "scripts/lib/ponder-executable-fingerprint.ts"
      - "scripts/lib/ponder-readiness-probe.ts"
      - "scripts/lib/ponder-deploy-state.ts"
      - "scripts/lib/ponder-deploy-plan.ts"
      - "scripts/lib/ponder-deploy-retention.ts"
      - "scripts/lib/ponder-views-switch.ts"
      - "scripts/ponder-deploy-fingerprints.ts"
      - "scripts/ponder-ready-probe.ts"
      - "scripts/ponder-deploy.sh"
      - "scripts/ponder-deploy-plan-cli.ts"
      - "scripts/ponder-views-switch-cli.ts"
      - "scripts/ponder-lag-sample.ts"
      - "scripts/ponder-decide-rollback-model.ts"
      - "scripts/lib/ponder-env.ts"
      - "scripts/lib/ponder-rpc-probe.ts"
      - "scripts/ponder-deploy-preflight.ts"
      - "scripts/lib/deploy-preflight-output.ts"

# Least privilege for GITHUB_TOKEN. Deploy uses repository secrets over SSH;
# secrets access is not controlled by this block. No job needs write.
permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ponder
      cancel-in-progress: false
    steps:
      - name: Require master
        run: test "$GITHUB_REF" = "refs/heads/master"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compute Ponder fingerprints
        id: fingerprints
        run: |
          # identity= / executable= lines → GITHUB_OUTPUT (no env values)
          node --import tsx scripts/ponder-deploy-fingerprints.ts >> "$GITHUB_OUTPUT"

      - name: Deploy Ponder to VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          IDENTITY_DIGEST: ${{ steps.fingerprints.outputs.identity }}
          EXECUTABLE_DIGEST: ${{ steps.fingerprints.outputs.executable }}
          DEPLOY_SHA: ${{ github.sha }}
          OPERATION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.operation || 'deploy' }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 30m
          envs: IDENTITY_DIGEST,EXECUTABLE_DIGEST,DEPLOY_SHA,OPERATION
          script: |
            set -euo pipefail
            cd /opt/kargain
            exec 9>.deploy.lock
            if ! flock -w 900 9; then
              echo "deploy_lock_not_acquired: waited 900s for .deploy.lock"
              exit 1
            fi

            PRIOR_CHECKOUT_SHA=$(git rev-parse HEAD)
            git fetch https://github.com/kargain-com/kargain.git master
            git checkout --force "$DEPLOY_SHA"
            DEPLOYED_COMMIT=$(git rev-parse HEAD)

            export PRIOR_CHECKOUT_SHA
            export PONDER_DEPLOY_ROOT=/opt/kargain
            export PONDER_STATE_FILE=/opt/kargain/.ponder-deploy-fingerprints
            export IDENTITY_DIGEST EXECUTABLE_DIGEST DEPLOY_SHA OPERATION

            # Detect nginx main-config change for proxy-only recreate path.
            NGINX_CONFIG_CHANGED=0
            if [ -f "$PONDER_STATE_FILE" ]; then
              STORED_EXEC=$(python3 -c "import json; print(json.load(open('$PONDER_STATE_FILE')).get('executable',''))")
              if [ -n "$STORED_EXEC" ] && [ "$STORED_EXEC" = "$EXECUTABLE_DIGEST" ]; then
                if git diff --name-only "$PRIOR_CHECKOUT_SHA" "$DEPLOY_SHA" | grep -q '^ops/nginx/ponder.conf$'; then
                  NGINX_CONFIG_CHANGED=1
                fi
              fi
            fi
            export NGINX_CONFIG_CHANGED

            chmod +x scripts/ponder-deploy.sh
            scripts/ponder-deploy.sh
