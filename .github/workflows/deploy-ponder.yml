name: Deploy Ponder to VPS

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "deploy ships this commit; rollback switches to the previous writer (ADR 0016 §i)"
        type: choice
        options: [deploy, rollback]
        default: deploy
  push:
    branches: [master]
    # paths and paths-ignore cannot both be set on the same event; exclude by omission.
    # svm-ingest/** and Dockerfile.svm-ingest are not Ponder inputs.
    # lib/svm files the executable graph reaches are Ponder inputs.
    # Directory patterns are enough: the executable digest decides recreate.
    paths:
      - "ponder.config.ts"
      - "ponder.schema.ts"
      - "src/**"
      - "lib/**"
      - "scripts/**"
      - "Dockerfile.ponder"
      - "docker-compose.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-ponder.yml"

# Least privilege for GITHUB_TOKEN. Deploy uses repository secrets over SSH;
# secrets access is not controlled by this block. No job needs write.
permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ponder
      cancel-in-progress: false
    steps:
      - name: Require master
        run: test "$GITHUB_REF" = "refs/heads/master"

      # Identities, state, preflight and probes run on the server in the
      # ponder-deploy service (ADR 0016 §e); the runner only opens SSH.
      - name: Deploy Ponder to VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          PONDER_OPERATION: ${{ inputs.operation || 'deploy' }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 45m
          envs: DEPLOY_SHA,PONDER_OPERATION
          script: |
            set -euo pipefail
            cd /opt/kargain
            exec 9>.deploy.lock
            if ! flock -w 900 9; then
              echo "deploy_lock_not_acquired: waited 900s for .deploy.lock"
              exit 1
            fi

            git fetch https://github.com/kargain-com/kargain.git master
            git checkout --force "$DEPLOY_SHA"
            exec scripts/ponder-deploy.sh "$PONDER_OPERATION" kargain kargain-ponder
