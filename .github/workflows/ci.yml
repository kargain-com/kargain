name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

concurrency:
  # Per-workflow group. A shared `ci-${{ github.ref }}` across the push-triggered
  # CI workflow and every deploy `workflow_call` caused caller workflows to vanish
  # (Deploy svm-ingest never appeared for path-matching pushes; run ids between CI
  # and Deploy Ponder 404). github.workflow is the caller name under workflow_call.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Master deploys must not cancel an in-flight gates job they are waiting on.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so append-only can `git show <push.before|PR base>:ix.manifest.json`.
          # workflow_call inherits the caller's push/PR github context (not a merge-base path).
          fetch-depth: 0

      - name: Ensure origin/master ref present
        # Local tooling / inspect; Actions append-only uses push before or PR base only.
        run: git fetch --no-tags origin master:refs/remotes/origin/master

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
          pnpm --version

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          # svm/tsconfig resolves @solana/* via svm/lab/node_modules (gitignored).
          pnpm --dir svm/lab install --frozen-lockfile

      - name: Compile Hardhat artifacts
        run: pnpm compile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # CI_GATE_SCRIPTS sole owner: lib/architecture/ci-verify-partition.ts
      - name: test:ci
        run: pnpm test:ci

      - name: test:unit
        run: pnpm test:unit

      - name: test
        run: pnpm test

      - name: test:commerce-ui
        run: pnpm test:commerce-ui

      - name: test:passport-ui
        run: pnpm test:passport-ui

      - name: test:bridge
        run: pnpm test:bridge

      - name: test:listing
        run: pnpm test:listing

      - name: test:metadata
        run: pnpm test:metadata

      - name: test:messaging
        run: pnpm test:messaging

      - name: test:nostr
        run: pnpm test:nostr

      - name: test:notifications
        run: pnpm test:notifications

      - name: test:trust
        run: pnpm test:trust

      - name: test:records
        run: pnpm test:records

      - name: test:geo
        run: pnpm test:geo

      - name: test:vincent-commons
        run: pnpm test:vincent-commons

      - name: test:verifier
        run: pnpm test:verifier

      - name: test:confirm-status
        run: pnpm test:confirm-status

      - name: test:vin-insight
        run: pnpm test:vin-insight

      - name: test:vin-assist
        run: pnpm test:vin-assist

      - name: test:vincent
        run: pnpm test:vincent

      - name: test:ponder
        run: pnpm test:ponder

      - name: Build
        run: pnpm build
