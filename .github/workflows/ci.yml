name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # Do not cancel an in-flight run on master (deploy may be waiting on gates).
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compile Hardhat artifacts
        run: pnpm compile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: test:ci
        run: pnpm test:ci

      - name: Build
        run: pnpm build
