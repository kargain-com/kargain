name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

concurrency:
  # Per-workflow group. A shared `ci-${{ github.ref }}` across the push-triggered
  # CI workflow and every deploy `workflow_call` caused caller workflows to vanish
  # (Deploy svm-ingest never appeared for path-matching pushes; run ids between CI
  # and Deploy Ponder 404). github.workflow is the caller name under workflow_call.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Master deploys must not cancel an in-flight gates job they are waiting on.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
          pnpm --version

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          # svm/tsconfig resolves @solana/* via svm/lab/node_modules (gitignored).
          pnpm --dir svm/lab install --frozen-lockfile

      - name: Compile Hardhat artifacts
        run: pnpm compile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: test:ci
        run: pnpm test:ci

      - name: Build
        run: pnpm build
