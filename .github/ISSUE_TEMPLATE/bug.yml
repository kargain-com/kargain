name: Bug
description: Defect with reproduction and expected behaviour
title: ""
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the defect.
    validations:
      required: true
  - type: textarea
    id: measured
    attributes:
      label: Measured on
      description: Commit SHA, environment, and commands used.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that fail today.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead (include error text if any).
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Trust, custody, money, identity, multi-VM — or "unknown".
    validations:
      required: true
