# Exact-fixture allowlists only: path AND generic-api-key AND the listed secret.
# A new secret in an allowlisted file, or any other rule, stays red.

title = "kargain"

[extend]
useDefault = true

[[allowlists]]
description = "Hardhat account #0 private key fixture used by profile attestation tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = ['''(^|/)test/profile-attestation\.test\.ts$''']
regexes = ['''^0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''']

[[allowlists]]
description = "Hardhat account #0 private key fixture used by attested-profile resolver tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = ['''(^|/)test/resolve-attested-profile\.test\.ts$''']
regexes = ['''^0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''']

[[allowlists]]
description = "Synthetic hex private-key fixtures for Vincent commons review tests"
