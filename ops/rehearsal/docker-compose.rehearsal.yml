# Rehearsal-only override (ADR 0015 / #73). Never referenced by a deploy workflow
# or scripts/ponder-deploy.sh (policy-pinned).
# Selected via: COMPOSE_FILE=docker-compose.yml:ops/rehearsal/docker-compose.rehearsal.yml
# Real Ponder slots index local Hardhat only — local-only preflight probes that chain.
# Start/window come from the rehearsal's local deployment (no invented 0/1).
# Local addresses come from the rehearsal's deploy:local (31337.json → env).
# Required so a legacy slot image (empty deployments/) can run under ENABLE_LOCAL.
x-rehearsal-env: &rehearsal-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://ponder:${POSTGRES_PASSWORD}@postgres:5432/kargain_ponder}
  PONDER_ENABLE_LOCAL: "1"
  PONDER_LOCAL_ONLY: "1"
  PONDER_RPC_URL_31337: ${PONDER_RPC_URL_31337:-http://host.docker.internal:8545}
  PONDER_RPC_URLS_31337: ${PONDER_RPC_URLS_31337:-http://host.docker.internal:8545}
  PONDER_START_BLOCK_31337: ${PONDER_START_BLOCK_31337:?PONDER_START_BLOCK_31337 required}
  PONDER_GETLOGS_BLOCK_RANGE_31337: ${PONDER_GETLOGS_BLOCK_RANGE_31337:?PONDER_GETLOGS_BLOCK_RANGE_31337 required}
  PONDER_KAR_PASSPORT_ADDRESS: ${PONDER_KAR_PASSPORT_ADDRESS:?PONDER_KAR_PASSPORT_ADDRESS required}
  PONDER_KAR_PRO_PASS_ADDRESS: ${PONDER_KAR_PRO_PASS_ADDRESS:?PONDER_KAR_PRO_PASS_ADDRESS required}
  PONDER_KAR_PRO_STAKING_ADDRESS: ${PONDER_KAR_PRO_STAKING_ADDRESS:?PONDER_KAR_PRO_STAKING_ADDRESS required}
  PONDER_USDC_ADDRESS: ${PONDER_USDC_ADDRESS:?PONDER_USDC_ADDRESS required}
  PONDER_NATIVE_FEED_ADDRESS: ${PONDER_NATIVE_FEED_ADDRESS:?PONDER_NATIVE_FEED_ADDRESS required}
  PONDER_TIMELOCK_ADDRESS: ${PONDER_TIMELOCK_ADDRESS:?PONDER_TIMELOCK_ADDRESS required}
  PONDER_PLATFORM_RECIPIENT_ADDRESS: ${PONDER_PLATFORM_RECIPIENT_ADDRESS:?PONDER_PLATFORM_RECIPIENT_ADDRESS required}
  PONDER_FIXED_PRICE_CONSIGNMENT_ADDRESS: ${PONDER_FIXED_PRICE_CONSIGNMENT_ADDRESS:-}
  PONDER_ASCENDING_CONSIGNMENT_ADDRESS: ${PONDER_ASCENDING_CONSIGNMENT_ADDRESS:-}
  PONDER_BRIDGE_GATEWAY_ADDRESS: ${PONDER_BRIDGE_GATEWAY_ADDRESS:-}

services:
  ponder-blue:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *rehearsal-env

  ponder-green:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *rehearsal-env
