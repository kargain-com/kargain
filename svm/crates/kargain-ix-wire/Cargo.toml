[package]
name = "kargain-ix-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Commercial instruction wire census — Rust BorshSerialize → committed manifest + goldens"

[[bin]]
name = "emit-ix-manifest"
path = "src/bin/emit-ix-manifest.rs"

[dependencies]
borsh = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
kar-passport = { path = "../../programs/kar-passport", features = ["no-entrypoint"] }
kar-gateway = { path = "../../programs/kar-gateway", features = ["no-entrypoint"] }
kar-pro-staking = { path = "../../programs/kar-pro-staking", features = ["no-entrypoint"] }
kar-pro-pass = { path = "../../programs/kar-pro-pass", features = ["no-entrypoint"] }
kar-fixed-price = { path = "../../programs/kar-fixed-price", features = ["no-entrypoint"] }
kar-ascending = { path = "../../programs/kar-ascending", features = ["no-entrypoint"] }
kargain-price = { workspace = true }
