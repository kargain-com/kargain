[package]
name = "kargain-ix-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Commercial instruction + PDA wire census — Rust truth → committed manifests + goldens"

[[bin]]
name = "emit-ix-manifest"
path = "src/bin/emit-ix-manifest.rs"

[[bin]]
name = "emit-pda-manifest"
path = "src/bin/emit-pda-manifest.rs"

[[bin]]
name = "emit-foreign-programs-manifest"
path = "src/bin/emit-foreign-programs-manifest.rs"

[dependencies]
borsh = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
solana-program = { workspace = true }
mpl-core = { workspace = true }
kar-passport = { path = "../../programs/kar-passport", features = ["no-entrypoint"] }
kar-gateway = { path = "../../programs/kar-gateway", features = ["no-entrypoint"] }
kar-pro-staking = { path = "../../programs/kar-pro-staking", features = ["no-entrypoint"] }
kar-pro-pass = { path = "../../programs/kar-pro-pass", features = ["no-entrypoint"] }
kar-fixed-price = { path = "../../programs/kar-fixed-price", features = ["no-entrypoint"] }
kar-ascending = { path = "../../programs/kar-ascending", features = ["no-entrypoint"] }
kargain-price = { workspace = true }
kargain-consignment-base = { workspace = true }
kargain-claimable-payouts = { workspace = true }
kargain-bonded-challenge = { workspace = true }
